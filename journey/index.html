];let current=0,step=0,done=false;const $=id=>document.getElementById(id);function render(){let s=scenes[current];step=0;done=false;$('art').style.backgroundImage=`url('${s.img}')`;let main=document.querySelector('.main');main.style.animation='none';void main.offsetWidth;main.style.animation='';$('eyebrow').textContent=s.tag;$('title').textContent=s.title;$('desc').textContent=s.desc;$('hint').textContent=s.hint;$('question').textContent=s.q;$('instruction').textContent=s.instructions;$('word').innerHTML='<strong>✦</strong>'+s.word;$('feedback').textContent='';$('back').style.visibility=current?'visible':'hidden';$('next').disabled=true;$('next').textContent=current===scenes.length-1?'再玩一次 ↻':'继续探险 →';$('progress').innerHTML=scenes.map((_,i)=>`<span class="dot ${i<=current?'on':''}"></span>`).join('');$('choices').innerHTML='';s.options.forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>choose(i,b);$('choices').appendChild(b)});if(s.detail){let b=document.createElement('button');b.className='choice';b.textContent='🔎 看看'+({mouth:'嘴巴',digest:'胃',heart:'心脏',lungs:'肺',brain:'大脑'})[s.detail];b.onclick=()=>showDetail(s.detail);$('choices').appendChild(b)}if(s.detail2){let b=document.createElement('button');b.className='choice';b.textContent='🔎 看看'+({intestine:'肠',bones:'骨骼和肌肉'})[s.detail2];b.onclick=()=>showDetail(s.detail2);$('choices').appendChild(b)}}function choose(i,b){let s=scenes[current];if(done)return;let rect=b.getBoundingClientRect();for(let n=0;n<5;n++){let a=document.createElement('span');a.className='burst';a.setAttribute('aria-hidden','true');a.textContent=(current===1?'✨':current===4?'💗':'✦');a.style.left=(rect.left+rect.width/2)+'px';a.style.top=rect.top+'px';a.style.setProperty('--dx',((n-2)*25)+'px');document.body.appendChild(a);setTimeout(()=>a.remove(),1000)}if(s.count){step++;$('feedback').textContent=step<s.count?`再来 ${s.count-step} 下！`:s.feedback;done=step>=s.count}else if(s.sequence){if(i===step){b.classList.add('selected');step++;$('feedback').textContent=step===s.options.length?s.feedback:'对啦，继续找下一步！';done=step===s.options.length}else $('feedback').textContent='再想想，我们刚刚走到哪里？'}else{done=i===s.correct;$('feedback').textContent=done?s.feedback:'再想一想，试试别的选择。';if(done)b.classList.add('selected')}$('next').disabled=!done;if(done&&current===0)showMovie('opening.mp4')}const details={mouth:['认识嘴巴','嘴巴里：牙齿 + 舌头','牙齿把食物嚼碎，舌头帮助搅拌。'],intestine:['小肠的秘密','胃 → 小肠 → 大肠','小肠内壁有许多小小的绒毛，帮助吸收营养。'],brain:['大脑和神经','大脑 → 神经 → 身体','大脑通过神经传递信息，指挥我们思考和动作。'],bones:['骨骼和肌肉','骨骼 + 关节 + 肌肉','骨骼支撑身体，关节让骨头连接，肌肉牵动骨骼。'],digest:['食物的旅行','嘴巴 → 食管 → 胃 → 小肠','胃会搅拌食物。小肠进一步消化食物，并吸收大部分营养。'],heart:['心脏与血管','心脏 ♥ → 血管 → 身体各处 → 心脏','心脏位于胸腔内，像泵一样推动血液沿血管流动。'],lungs:['肺的内外','鼻或口 → 气管 → 支气管 → 肺','两肺位于胸腔里。空气沿气管和支气管进入肺，肺中很小的肺泡帮助气体交换。'],movement:['身体怎样动起来','大脑 → 神经 → 肌肉 ↔ 骨骼','大脑通过神经发出信号，肌肉收缩牵动骨骼，我们就能做动作。']};function showDetail(k){let x=details[k];$('modalTitle').textContent=x[0];$('organViewer').style.display=['mouth','digest','intestine','heart','lungs','brain','bones'].includes(k)?'block':'none';$('organimg').src=({mouth:'organ-mouth.webp',digest:'organ-stomach.webp',intestine:'organ-intestine.webp',heart:'organ-heart.webp',lungs:'organ-lungs.webp',brain:'organ-brain.webp',bones:'organ-bones.webp'})[k]||'';let captions={mouth:['嘴巴里有牙齿和舌头，帮我们处理食物。','仔细看看，牙齿和舌头一起帮食物变小。'],intestine:['弯弯绕绕的是小肠，外面的一圈是大肠。','放大看看，小肠内壁有许多小绒毛，帮助吸收营养。'],brain:['这位是大脑，它帮助我们思考和指挥身体。','这是一颗神经细胞的想象示意，神经帮忙传递信息。'],bones:['胳膊里的骨骼和肌肉一起合作。','看看关节附近，肌肉牵动骨骼，就能弯手臂。'],digest:['这就是胃的外形：食管通向胃，胃的另一端通向小肠。','放大看看：胃的内壁有皱褶，胃会搅拌食物。'],heart:['从外面看，心脏连接着大大小小的血管。','从里面看，心脏有四个腔，帮助血液按方向流动。'],lungs:['这是一对肺，气管向下分成支气管。','再放大！肺里有许多小小的肺泡，帮助气体交换。']};function side(inside){$('organimg').style.transform=inside?'translateX(-50%)':'none';$('organimg').alt=x[0]+(inside?'内部示意':'外观示意');$('organCaption').textContent=captions[k][inside?1:0];$('outside').classList.toggle('selected',!inside);$('inside').classList.toggle('selected',inside)}if(captions[k]){side(false);$('outside').onclick=()=>side(false);$('inside').onclick=()=>side(true)}$('diagram').textContent=x[1];$('detail').textContent=x[2];$('modal').classList.add('open');$('close').focus()}$('close').onclick=()=>{$('modal').classList.remove('open')};$('modal').onclick=e=>{if(e.target===$('modal'))$('close').click()};function showMovie(src){narration.pause();$('movievideo').src=src;$('movievideo').muted=true;$('movie').classList.add('open');$('movievideo').play().catch(()=>{});speak()}$('movieskip').onclick=()=>{$('movievideo').pause();$('movie').classList.remove('open')};$('movievideo').onended=()=>{if(narration.paused||narration.ended)$('movieskip').click()};let narration=new Audio();narration.onended=()=>{if($('movie').classList.contains('open')&&$('movievideo').ended)$('movieskip').click()};function speak(){narration.pause();narration.src='voice-'+current+'.mp3';narration.play().catch(()=>{});} $('next').onclick=()=>{current=current===scenes.length-1?0:current+1;render();if(current===9)showMovie('ending.mp4');else speak()};$('back').onclick=()=>{if(current){current--;render();speak()}};$('sound').onclick=speak;render();</script></body></html>
