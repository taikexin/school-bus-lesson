ong.onclick=()=>{pop(song);playSong()};wrap.appendChild(song);let film=document.createElement('button');film.className='song-button';film.textContent='🎬 再看完整旅程';film.onclick=()=>{pop(film);playFilm()};wrap.appendChild(film);document.querySelector('.panel').appendChild(wrap)}[s.detail,s.detail2].filter(Boolean).forEach(kind=>{let pair=document.createElement('div');pair.className='pair';let data=organData[kind];[false,true].forEach(inside=>{let card=document.createElement('button');card.className='organ-card';card.style.backgroundImage=`url('${data[0]}')`;card.style.backgroundPosition=inside?'right center':'left center';card.innerHTML='<b>'+(inside?'里面':'外面')+'</b>';card.setAttribute('aria-label',data[1]+(inside?'里面':'外面')+'，点击放大');card.onclick=()=>{card.classList.add('seen');showDetail(kind,inside)};pair.appendChild(card)});document.querySelector('.panel').appendChild(pair)})}
function pumpWords(){if(wordBusy||current!==9||!wordQueue.length)return;wordBusy=true;let epoch=wordEpoch,item=wordQueue.shift(),start=()=>{if(epoch!==wordEpoch||current!==9){wordBusy=false;return}item.button.classList.remove('waiting');item.button.classList.add('speaking');say(item.sound,()=>{if(epoch!==wordEpoch||current!==9)return;item.button.classList.remove('speaking');item.button.classList.add('heard');wordBusy=false;if(wordQueue.length)pumpWords();else if(!wordSongPlayed&&item.wrap.querySelectorAll('.word-card.heard').length===3)playSong()})};if(!narration.paused&&!narration.ended){narration.addEventListener('ended',start,{once:true})}else start()}
function choose(btn,index=0){if(done)return;pop(btn);if([3,6,7].includes(current)&&index!==0){$('feedback').textContent='再试试另一个吧！';queueCue('tryagain');return}if(current===0){done=true;$('next').disabled=false;showMovie('opening.mp4','今天，尼克带你一起探索身体的奥秘！');return}step++;sceneReaction(current);let motion=$('sceneMotion');if(motion.ended&&!motion.classList.contains('restarting')){let scene=current;motion.classList.add('restarting');setTimeout(()=>{if(current!==scene||motion!==$('sceneMotion'))return;motion.currentTime=0;motion.play().catch(()=>{});requestAnimationFrame(()=>motion.classList.remove('restarting'))},220)}btn.dataset.progress=String(step);document.querySelectorAll('.tap-progress i').forEach((dot,i)=>dot.classList.toggle('lit',i<step));let states={1:['🍎','🍏','✨'],2:['🍎','🥣','✨'],3:['🔴','💌'],4:['💗','💖','💗'],5:['🫧','💨'],6:['💪','🙌'],7:['🧼','🫧','✨']};btn.classList.remove('pressed');void btn.offsetWidth;btn.classList.add('pressed');let need=[0,3,3,1,3,2,1,1,1,1][current];if(step<need){$('feedback').textContent='再来一下！';if(narration.paused||narration.ended)say('tap-again')}else{done=true;$('feedback').textContent=current===2?'搅一搅！小肠接着吸收营养。':current===3?'营养搭上血液，出发啦！':scenes[current].feedback;$('next').disabled=false;btn.classList.add('selected');if(current===9&&wordBusy){$('autoHint').textContent='';}else finishCue()}}
function showDetail(k,inside){advancePending=false;cancelAuto();let motion=$('sceneMotion');detailMotionWasPlaying=!motion.paused&&!motion.ended;if(detailMotionWasPlaying)motion.pause();detailKind=k;detailInside=inside;detailStep=0;let d=organData[k];$('modalTitle').textContent='🔍 '+d[1]+(inside?' · 里面':' · 外面');$('detailArt').style.backgroundImage=`url('${d[0]}')`;$('detailArt').style.backgroundPosition=inside?'right center':'left center';$('detailTap').textContent=d[3];let dc=({mouth:1,digest:1,intestine:7,heart:3,lungs:4,brain:7,bones:5})[k];let pic=document.createElement('span');pic.className='picture-token';pic.style.backgroundPosition=(dc%4*100/3)+'% '+(dc<4?'0%':'100%');$('detailTap').replaceChildren(pic);$('detailMessage').textContent='点点大图，发现秘密！';$('detailArt').classList.remove('revealed');$('modal').classList.add('open');$('close').focus();say(inside?'inside':'outside')}
function discoverDetail(e){if(e)e.stopPropagation();let art=$('detailArt');art.classList.remove('revealed');void art.offsetWidth;$('detailSignal').textContent=({mouth:'✨',digest:'🍎',intestine:'✨',heart:'💗',lungs:'🫧',brain:'✨',bones:'💪'})[detailKind];art.classList.add('revealed');pop($('detailTap'));detailStep++;$('detailMessage').textContent='发现啦！'+organData[detailKind][2];$('detailTap').setAttribute('aria-label','再听一次这个秘密');queueCue('detail-'+detailKind)}
$('detailTap').onclick=discoverDetail;$('detailArt').onclick=discoverDetail;function closeDetail(){$('modal').classList.remove('open');if(detailMotionWasPlaying){detailMotionWasPlaying=false;$('sceneMotion').play().catch(()=>{})}++runToken;narration.pause();if(done)say('return',scheduleAuto)}$('close').onclick=closeDetail;$('detailDone').onclick=closeDetail;$('modal').onclick=e=>{if(e.target===$('modal'))closeDetail()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').classList.contains('open'))closeDetail()});
function showMovie(src,caption){cancelAuto();++runToken;narration.pause();let opening=src==='opening.mp4',v=$('movievideo');let token=++movieSequenceToken;movieSequenceDone=false;v.ontimeupdate=null;v.onended=null;v.src=opening?'opening-with-sound.mp4':'ending-with-sound.mp4';v.muted=false;v.volume=.18;$('moviecaption').textContent=caption;$('movie').classList.add('open');v.onended=()=>{if(token!==movieSequenceToken)return;v.onended=null;v.style.opacity='0';setTimeout(()=>{if(token!==movieSequenceToken)return;v.src=opening?'mouth-motion.mp4':'song-motion.mp4';v.muted=true;v.onloadedmetadata=()=>{v.onloadedmetadata=null;if(token!==movieSequenceToken)return;v.currentTime=opening?0:.3;v.style.opacity='1';v.play().catch(()=>{})};v.ontimeupdate=()=>{if(v.currentTime>=(opening?3:3.5)){v.ontimeupdate=null;v.pause();movieSequenceDone=true;if(narration.paused||narration.ended)$('movieskip').click()}};v.load()},250)};v.play().catch(()=>{});say(opening?'start':'ending')}
$('movieskip').onclick=()=>{let v=$('movievideo');++movieSequenceToken;v.pause();v.ontimeupdate=null;v.onended=null;v.onloadedmetadata=null;v.style.opacity='1';$('movie').classList.remove('open');++runToken;narration.pause();if(current===0){openingHandoffAt=movieSequenceDone?v.currentTime:0;current=1;render();story()}else if(current===8){current=9;render();say('word-intro')}};$('moviereplay').onclick=()=>showMovie(current===0?'opening.mp4':'ending.mp4',current===0?'今天，尼克带你一起探索身体的奥秘！':'身体里的伙伴们一起合作，真神奇！');
function requestAdvance(){if(!done||advancePending||transitioning)return;let scene=current,target=current===scenes.length-1?0:current+1;advancePending=true;$('autoHint').textContent='听完这句，校车就出发！';function waitForVoice(){if(!advancePending||current!==scene||$('modal').classList.contains('open')||$('movie').classList.contains('open')){advancePending=false;return}if(!narration.paused&&!narration.ended){narration.addEventListener('ended',waitForVoice,{once:true});return}advancePending=false;travelTo(target)}waitForVoice()}
$('next').onclick=requestAdvance;$('back').onclick=()=>{if(current)travelTo(current-1)};$('sound').onclick=()=>{if(wordBusy)return;cancelAuto();if($('modal').classList.contains('open'))say('detail-'+detailKind);else{story();if(done){let token=runToken,scene=current;narration.onended=()=>{if(token===runToken&&scene===current)scheduleAuto()}}}};render();
