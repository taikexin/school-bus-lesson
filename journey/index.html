function render(){let s=scenes[current];step=0;done=false;$('art').style.backgroundImage=`url('${s.img}')`;let motion=$('sceneMotion');if([1,3,4].includes(current)){$('art').style.display='none';motion.style.display='block';motion.src=({1:'mouth-motion.mp4',3:'blood-motion.mp4',4:'heart-motion.mp4'})[current];motion.play().catch(()=>{})}else{motion.pause();motion.style.display='none';$('art').style.display='block'}$('eyebrow').textContent=s.tag;$('title').textContent=s.title;$('desc').textContent=s.desc;$('hint').textContent='';$('question').textContent=current===0?'和尼克一起出发！':current===9?'探险完成啦！':'跟尼克一起玩';$('instruction').textContent=current===0?'点点车票，我们出发！':current===9?'点点勋章，再玩一次！':'听一听，点一点';$('word').textContent='';$('feedback').textContent='';$('back').style.visibility=current?'visible':'hidden';$('next').disabled=true;$('next').textContent=current===9?'再玩一次 ↻':'继续探险 →';$('progress').innerHTML='';let choices=$('choices');choices.innerHTML='';let options=({3:['🔴','☁️','🍃'],6:['💪','☁️'],7:['🧼','🍬']})[current]||[icons[current]];options.forEach((icon,index)=>{let action=document.createElement('button');action.className='choice play-action';action.textContent=icon;action.setAttribute('aria-label',index===0?labels[current]:'试试其他选项');action.onclick=()=>choose(action,index);choices.appendChild(action)});document.querySelectorAll('.pair').forEach(x=>x.remove());[s.detail,s.detail2].filter(Boolean).forEach(kind=>{let pair=document.createElement('div');pair.className='pair';let data=organData[kind];[false,true].forEach(inside=>{let card=document.createElement('button');card.className='organ-card';card.style.backgroundImage=`url('${data[0]}')`;card.style.backgroundPosition=inside?'right center':'left center';card.innerHTML='<b>'+(inside?'里面':'外面')+'</b>';card.setAttribute('aria-label',data[1]+(inside?'里面':'外面')+'，点击放大');card.onclick=()=>showDetail(kind,inside);pair.appendChild(card)});document.querySelector('.panel').appendChild(pair)})}
function choose(btn,index=0){if(done)return;pop(btn);if([3,6,7].includes(current)&&index!==0){$('feedback').textContent='再试试另一个吧！';say('tryagain');return}if(current===0){done=true;$('next').disabled=false;showMovie('opening.mp4','今天，尼克带你一起探索身体的奥秘！');return}step++;let states={1:['🍎','🍏','✨'],2:['🍎','🥣','✨'],3:['🔴','💌'],4:['💗','💖','💗'],5:['🫧','💨'],6:['💪','🙌'],7:['🧼','🫧','✨']};if(states[current])btn.textContent=states[current][Math.min(step-1,states[current].length-1)];let need=[0,3,3,1,3,2,1,1,1,1][current];if(step<need){$('feedback').textContent='再来一下！';say('tap-again')}else{done=true;$('feedback').textContent=current===2?'搅一搅！小肠接着吸收营养。':current===3?'营养搭上血液，出发啦！':scenes[current].feedback;$('next').disabled=false;btn.classList.add('selected');say(current===9?'ending':'tap-success')}}
function showDetail(k,inside){detailKind=k;detailInside=inside;detailStep=0;let d=organData[k];$('modalTitle').textContent='🔍 '+d[1]+(inside?' · 里面':' · 外面');$('detailArt').style.backgroundImage=`url('${d[0]}')`;$('detailArt').style.backgroundPosition=inside?'right center':'left center';$('detailTap').textContent=d[3];$('detailMessage').textContent='点一点，发现秘密！';$('modal').classList.add('open');$('close').focus();say('detail-'+k)}
$('detailTap').onclick=()=>{pop($('detailTap'));detailStep++;$('detailMessage').textContent=organData[detailKind][2];say('detail-'+detailKind)};function closeDetail(){$('modal').classList.remove('open');++runToken;narration.pause()}$('close').onclick=closeDetail;$('detailDone').onclick=closeDetail;$('modal').onclick=e=>{if(e.target===$('modal'))closeDetail()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').classList.contains('open'))closeDetail()});
function showMovie(src,caption){++runToken;narration.pause();let v=$('movievideo');v.src=src==='opening.mp4'?'opening-with-sound.mp4':'ending-with-sound.mp4';v.muted=false;v.volume=.18;$('moviecaption').textContent=caption;$('movie').classList.add('open');v.play().catch(()=>{});say(src==='opening.mp4'?'start':'ending')}
$('movieskip').onclick=()=>{$('movievideo').pause();$('movie').classList.remove('open');++runToken;narration.pause();if(current===0){current=1;render();story()}else if(current===8){current=9;render()}};$('moviereplay').onclick=()=>{$('movievideo').currentTime=0;$('movievideo').play().catch(()=>{});say(current===0?'start':'ending')};$('movievideo').onended=()=>{if(narration.paused||narration.ended)$('movieskip').click()};
$('next').onclick=()=>{if(!done)return;current=current===scenes.length-1?0:current+1;render();if(current===8)showMovie('ending.mp4','身体里的伙伴们一起合作，真神奇！');else story()};$('back').onclick=()=>{if(current){current--;render();story()}};$('sound').onclick=()=>{if($('modal').classList.contains('open'))say('detail-'+detailKind);else story()};render();
</script></body></html>
